# Opens a PR that moves the kiln formula to a new release. Kiln's release
# workflow sends the kiln-release dispatch when a release is published.
name: bump

on:
  repository_dispatch:
    types: [kiln-release]
  workflow_dispatch:
    inputs:
      tag:
        description: Kiln tag, like v0.5.3
        required: true
      revision:
        description: Full commit SHA the tag points at
        required: true

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          token: ${{ secrets.TAP_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1

      - name: Open bump PR
        env:
          # Not GITHUB_TOKEN: a PR opened with it doesn't start test-bot.
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TAP_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          REVISION: ${{ github.event.client_payload.revision || inputs.revision }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Want a tag like v1.2.3 and a 40-character SHA (got \"$TAG\", \"$REVISION\")."
            exit 1
          fi
          brew bump-formula-pr --no-fork --no-browse \
            --tag="$TAG" --revision="$REVISION" \
            "$GITHUB_REPOSITORY_OWNER/tap/kiln"
